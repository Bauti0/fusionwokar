name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run unit/integration tests
        run: npm run test
        env:
          NODE_ENV: development
          DEMO_MODE: "true"
          TURSO_DATABASE_URL: "file::memory:"
          TURSO_AUTH_TOKEN: ""
          MP_ACCESS_TOKEN: "TEST_TOKEN"
          MP_WEBHOOK_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ADMIN_PASSWORD: "testpass123"
          ADMIN_USER: "superadmin"