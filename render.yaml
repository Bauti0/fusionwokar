# Render blueprint — Fusión Wok
# Deploy único: `npm ci --include=dev && npm run build && node server/index.js`
# `--include=dev` es OBLIGATORIO: el build necesita vite (devDependency). Sin este
# flag, un `NODE_ENV=production` en el entorno de build hace que npm omita las
# devDependencies y el build muera con `sh: 1: vite: not found`.
# Las variables con `sync: false` se setean una vez en el dashboard y no se
# pisotean en redeploys (se rellenan en el primer deploy).
services:
  - type: web
    name: fusion-wok
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false